{{/*
  Custom head extensions for analytics and features
*/}}

{{/* Cloudflare Web Analytics - Privacy-friendly, GDPR compliant, no cookies */}}
{{ if .Site.Params.cloudflareAnalytics }}
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "{{ .Site.Params.cloudflareAnalytics }}"}'></script>
{{ end }}

{{/* Mermaid Diagram Support */}}
{{ if .Params.mermaid }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({
    startOnLoad: true,
    theme: 'base',
    themeVariables: {
      background: '#14161B',
      primaryColor: '#3A3E46',
      primaryTextColor: '#F4EEE2',
      primaryBorderColor: '#6A6F78',
      lineColor: '#17897B',
      secondaryColor: '#0F6B60',
      tertiaryColor: '#B01230',
      noteBkgColor: '#E2C48C',
      noteBorderColor: '#C99B4F',
      noteTextColor: '#14161B',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: '13px'
    }
  });
</script>
{{ end }}
