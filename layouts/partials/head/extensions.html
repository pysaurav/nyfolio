{{/*
  Custom head extensions for analytics and features
*/}}

{{/* Cloudflare Web Analytics - Privacy-friendly, GDPR compliant, no cookies */}}
{{ if .Site.Params.cloudflareAnalytics }}
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "{{ .Site.Params.cloudflareAnalytics }}"}'></script>
{{ end }}

{{/* Mermaid Diagram Support */}}
{{ if .Params.mermaid }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ 
    startOnLoad: true,
    theme: 'default',
    themeVariables: {
      primaryColor: '#DC143C',
      primaryTextColor: '#fff',
      primaryBorderColor: '#0E1B2A',
      lineColor: '#0D7377',
      secondaryColor: '#14425A',
      tertiaryColor: '#FAF9F6'
    }
  });
</script>
{{ end }}
