<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <title>{{ block "title" . }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  {{ partial "head.html" . }}
</head>
<body>
  {{ block "nav" . }}{{ partial "nav.html" (dict "onInk" false) }}{{ end }}
  <main>{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
