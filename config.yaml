  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/kjerag.jpg"
    content: |-
      With 8 years of experience spanning backend engineering, AI implementation, and technical product management, I architect solutions that scale. My journey has taken me from startup environments to enterprise PropTech, where I've worked with major clients to transform operations through intelligent system design.

      As a Technical Product Manager and engineer, I bridge the gap between business needs and technical execution. I've scoped and delivered solutions across B2B real estate platforms, D2C applications, and ML-powered systems, often leading cross-functional teams through complex implementations.

      My expertise extends to AI Ethics and Fairness, ensuring that the systems I build are not just powerful, but responsible. I'm also a [Registered Scrum Master™](https://s3.amazonaws.com/scruminc-certs/RSM-3052636), combining technical depth with leadership and communication skills.

      **Technical Foundation:** Complex microservice architectures, Python, AWS, ETL pipelines, Machine Learning, multiple backend frameworks, and cloud-native architectures.

      **Research & Thought Leadership:** Published work on [Network Security with Machine Learning](/library/AnomalybasedIDS.pdf) and [Blockchain-powered Supply Chain](http://ictaes.org/wp-content/uploads/2019/09/3_IJAE_Vol2No2.pdf).

      Currently based in Oslo, Norway, where my interests span global geopolitics, human civilization, and psychology—patterns that inform how I build systems.

      Looking forward to meaningful collaborations!
    skills:
      enable: false
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "HTML"
        - "CSS"
        - "JavaScript"
        - "React"
        - "Node"
        - "Express"

