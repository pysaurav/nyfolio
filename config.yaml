  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/kjerag.jpg"
    content: |-
      I am a backend engineer who moved into AI, based in Oslo. Currently at Izy, maintaining the production backend for a Norwegian workplace platform and building the computer vision and demand forecasting that run on top of it.

      Eight years across backend architecture, machine learning and technical product, most of it before the current AI cycle began. Nearly all of it on systems that run every day rather than systems that demo well.

      What I care about is the part after the model works. Whether the data holds up, whether the team can operate it, and whether you can explain it to a regulator. That last question is why I studied AI ethics and fairness formally, and why I keep writing about it.

      [More about me →](/about/)
    skills:
