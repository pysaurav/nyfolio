  hero:
    enable: true
    intro: "Hi, I am"
    # Kept short deliberately: .t-hero runs to 72px, and a three-line headline
    # collided with the oversized background mark in the ink section.
    title: "Saurav Pandey"
    subtitle: "I build the backend systems that AI runs on<br>also the AI layer that runs on top of it."
    # Rendered lowercase as the eyebrow by layouts/index.html.
    location: "AI consultant · Oslo, Norway"
    content: "Currently at Izy, I maintain the backend behind hundreds of thousands of transactions a month, and the AI layer running on top of it. Demand forecasting and computer vision self-checkout, live across Norwegian commercial buildings.<br><br>I find the patterns that make systems scale. Eight years across backend architecture, AI and product, technical product management and Registered Scrum Master. I write about AI ethics and the directions I see this moving.<br><br><strong>Backend Engineering • AI Implementation • Product Development</strong>"
    image: /images/pp_11.jpeg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
