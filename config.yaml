  # What I do — the three pillars, in the order a buyer cares about them.
  # Retained for /ai-consulting/ reference, but no longer rendered on the
  # homepage, the homepage leads with writing and credibility, not the offer.
  pillars:
    enable: false
    title: "What I do"
    intro: "Three ways AI shows up in a software organisation. Most teams need help with more than one."
    items:
      - name: "AI in the product"
        content: "Forecasting, computer vision and LLM features that survive contact with real users and real volume. The hard part is rarely the model. It is the data, the evaluation, and the operational load nobody scoped."
      - name: "AI in the delivery"
        content: "Wiring AI into the development lifecycle itself: specification, code, review, testing, documentation, operations. Done well this compounds. Done badly it produces more code than a team can actually review."
      - name: "AI you can defend"
        content: "EU AI Act readiness, GDPR, bias and fairness review. The part most consultants skip, and the first thing a Norwegian board now asks about."

  # Credibility. Four things that are scarce among people selling AI advisory,
  # each with somewhere to verify it. Claims without a link are just adjectives.
  proof:
    enable: true
    title: "What backs this up"
    items:
      - claim: "Led the team that built AI self-checkout at Izy"
        content: "Computer vision that recognises a lunch tray and charges for it without a queue, running daily across Norwegian commercial buildings, with demand forecasting for the kitchens alongside it. Most people advising on AI have never had to operate what they recommended at 07:00 on a Monday."
      - claim: "160 hours of formal training in AI ethics"
        content: "Fairness metrics, causal intervention, governance and deployment, studied and certified through Turing College. Applied to systems that are actually running, not to case studies."
        linkText: "What it changed for me"
        linkUrl: "/posts/coding-is-solved-the-hard-part-starts-now/"
      - claim: "Two peer-reviewed papers"
        content: "Anomaly-based intrusion detection with machine learning, and a blockchain-powered supply chain published in IJAE. Both peer-reviewed."
        linkText: "Read the first"
        linkUrl: "/library/AnomalybasedIDS.pdf"
      - claim: "EU AI Act, read from inside the Norwegian market"
        content: "The Act reaches Norway through the EEA, and enforcement is landing now. I write about what it means for Norwegian companies rather than in the abstract."
        linkText: "On algorithmic bias in Norwegian hiring"
        linkUrl: "/posts/ai-discrimination-norwegian-hiring/"

  # Folded into the "Why listen to me" section, which said the same things with
  # sharper framing. Data kept in case it is wanted as its own section again.
  work:
    enable: false
    title: "Selected work"
    intro: "A sample of what this looks like in practice."
    items:
      - name: "AI self-checkout for workplace canteens"
        meta: "Computer vision · production"
        content: "Recognising a lunch tray's contents and charging for it without a queue. Shipped as mAIfood, running daily across Norwegian commercial buildings."
      - name: "Demand forecasting for daily operations"
        meta: "Machine learning · production"
        content: "Predicting how many people show up and what they will order, so kitchens buy the right amount. Less waste, fewer stockouts, decisions made on data rather than instinct."
      - name: "AI ethics and fairness practice"
        meta: "Research · writing"
        content: "160 hours of formal study in AI ethics through Turing College, applied to real systems, plus published writing on algorithmic bias in Norwegian hiring and on the EU AI Act."
      - name: "Published research"
        meta: "Peer-reviewed"
        content: "Two published papers: anomaly-based intrusion detection with machine learning, and a blockchain-powered supply chain (IJAE, 2019)."

