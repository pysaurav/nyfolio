baseURL: "https://saurav.no/"
publishDir: "public"
languageCode: "en"
defaultContentLanguage: "en"
title: "Saurav Pandey"
# theme: hugo-profile   # disconnected 2026-08-08 — layouts are repo-local now.
#                        Submodule left on disk; uncomment to fall back.

# llms.txt: a plain-language map of who this is and what they do, for retrieval
# agents that fetch it. Defined as an output format so it can never drift from
# the site's actual content.
outputFormats:
  LLMS:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
    - "LLMS"
  # "page" deliberately has no RSS: it was generating a per-post feed
  # (/posts/<slug>/index.xml) for every article. Twelve feeds, no subscribers.
  page:
    - "HTML"
  section:
    - "HTML"
    - "RSS"

# Was 3, which split 12 posts across 4 thin paginated URLs.
Paginate: 10
enableRobotsTXT: true

# Google has ignored <priority> and <changefreq> since 2015, and Bing reads
# inconsistent values as a spam signal. Empty/-1 omits them from the output.
sitemap:
  changefreq: ""
  filename: sitemap.xml
  priority: -1
# disqusShortname: your-disqus-shortname
# googleAnalytics: G-MEASUREMENT_ID

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    lineNumbersInTable: true
    noClasses: true
    style: monokai
    tabWidth: 4

Menus:
  main:
    - identifier: blog
      name: Blog
      title: Essays on AI, ethics and building systems
      url: /posts/
      weight: 1
    - identifier: consulting
      name: Consulting
      title: AI consulting
      url: /ai-consulting/
      weight: 2
    - identifier: about
      name: About
      title: About Saurav Pandey
      url: /about/
      weight: 3
    - identifier: contact
      name: Contact
      title: Get in touch
      url: /contact/
      weight: 4
    #- identifier: gallery
    #  name: Gallery
    #  title: Blog posts
    #  url: /gallery
    #  weight: 2
