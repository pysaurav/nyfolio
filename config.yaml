      name: "Book a conversation"
      url: "mailto:post@saurav.no?subject=Conversation%20about%20AI%20advisory&body=Hi%20Saurav%2C%0A%0AI%27m%20%5Byour%20name%5D%20at%20%5Bcompany%5D.%20We%27re%20building%20%5Bwhat%20you%27re%20working%20on%5D%2C%20and%20I%27d%20like%20a%20second%20opinion%20on%20%5Bwhere%20it%27s%20stuck%5D.%0A%0AWould%20you%20have%20time%20for%20a%20short%20call%20in%20the%20next%20week%20or%20two%3F%0A%0AThanks%2C%0A"
