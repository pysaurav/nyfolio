  favicon: "/brand/favicon.svg"

  # ---------------------------------------------------------------------------
  # SEO. Single source of truth for titles, share cards and JSON-LD.
  # Consumed by layouts/partials/head/{vars,schema}.html.
  # ---------------------------------------------------------------------------
  seo:
    lang: "en"
    ogLocale: "en_GB"          # OG spec wants language_TERRITORY, not "en-us"
    homeTitle: "AI Consultant in Oslo | Saurav Pandey"
    titleSuffix: "Saurav Pandey"
    ogImage: "/brand/og-default.png"
    twitterHandle: "@pysaurav"
    sameAs:
      - "https://github.com/pysaurav"
      - "https://www.linkedin.com/in/pysaurav/"
      - "https://x.com/pysaurav"
      - "https://medium.com/@pysaurav"
    person:
      name: "Saurav Pandey"
      givenName: "Saurav"
      familyName: "Pandey"
      jobTitle: "AI Consultant"
      email: "post@saurav.no"
      image: "/images/pp_11.jpeg"
      bio: "AI consultant and backend engineer based in Oslo. For three years I have maintained the production systems at Izy and built the computer vision and demand forecasting that run on top of them, live across Norwegian commercial buildings. Eight years across backend architecture, machine learning and technical product. Two published papers and formal study in AI ethics and fairness."
      knowsLanguage:
        - "en"
        - "nb"
      # Keep this list to what the site actually demonstrates. A long list
      # reads as keyword stuffing to an entity-resolution model.
      knowsAbout:
        - "Artificial Intelligence"
        - "AI Ethics"
        - "Algorithmic Fairness"
        - "EU AI Act"
        - "Machine Learning Engineering"
        - "Software Architecture"
        - "Backend Engineering"
        - "Technical Product Management"
        - "Python"
      worksFor:
        name: "Izy AS"
        url: "https://izy.no"

  
  #Cloudflare Web Analytics (Recommended - Free, no cookies)
  cloudflareAnalytics: "93ae2e7f0dae4114a1ce4813fd09c270"



  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
